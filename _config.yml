name: Neuroinflammation map
description: "The neuroinflammation map and its submaps"
google_analytics:
url: https://neuroinflammation.github.io
baseurl: ""
# the tab icon's folder in images/ and its version, added to its links so browsers fetch a new icon at once
icon: favicon-neuron
icon_version: ni84
defaults:
  # kept out of search engines (noindex in _includes/meta.html; robots.txt too)
  - scope:
      path: ""
    values:
      noindex: true
permalink: /:title/
kramdown:
  input: GFM
sass:
  style: :expanded
exclude:
  - README.md
